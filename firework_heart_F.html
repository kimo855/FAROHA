<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firework Heart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at bottom, #12051c, #020104 70%);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%);
      color: white;
      font-size: clamp(70px, 14vw, 150px);
      font-weight: bold;
      opacity: 0;
      text-shadow:
        0 0 10px #ffffff,
        0 0 25px #ff407d,
        0 0 50px #ff174d;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    .message.show {
      opacity: 1;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div class="message" id="message">F</div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");

    let width;
    let height;
    let heartPoints = [];
    let particles = [];
    let currentPoint = 0;
    let animationStarted = false;

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      createHeartPoints();
    }

    window.addEventListener("resize", resizeCanvas);

    function createHeartPoints() {
      heartPoints = [];

      const scale = Math.min(width, height) / 34;
      const centerX = width / 2;
      const centerY = height / 2 - scale * 2;

      for (let t = 0; t <= Math.PI * 2; t += 0.025) {
        const x = 16 * Math.pow(Math.sin(t), 3);

        const y =
          13 * Math.cos(t) -
          5 * Math.cos(2 * t) -
          2 * Math.cos(3 * t) -
          Math.cos(4 * t);

        heartPoints.push({
          x: centerX + x * scale,
          y: centerY - y * scale
        });
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 0.5;

        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.life = Math.random() * 45 + 35;
        this.maxLife = this.life;
        this.size = Math.random() * 3 + 1;
        this.color = color;
        this.gravity = 0.025;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        this.vy += this.gravity;
        this.vx *= 0.985;
        this.vy *= 0.985;

        this.life--;
      }

      draw() {
        const opacity = Math.max(this.life / this.maxLife, 0);

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(${this.color}, ${opacity})`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = `rgba(${this.color}, ${opacity})`;

        ctx.fill();
      }
    }

    function createFirework(x, y) {
      const colors = [
        "255, 23, 68",
        "255, 64, 129",
        "255, 255, 255",
        "255, 193, 7"
      ];

      const color = colors[Math.floor(Math.random() * colors.length)];

      for (let i = 0; i < 14; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function drawHeartTrail() {
      if (currentPoint < heartPoints.length) {
        const amount = 5;

        for (let i = 0; i < amount; i++) {
          if (currentPoint >= heartPoints.length) break;

          const point = heartPoints[currentPoint];

          createFirework(point.x, point.y);
          currentPoint++;
        }
      } else if (!animationStarted) {
        animationStarted = true;

        createFinalExplosion();

        setTimeout(() => {
          message.classList.add("show");
        }, 700);

        setTimeout(restartAnimation, 5000);
      }
    }

    function createFinalExplosion() {
      const centerX = width / 2;
      const centerY = height / 2;

      for (let i = 0; i < 150; i++) {
        particles.push(
          new Particle(
            centerX + (Math.random() - 0.5) * 100,
            centerY + (Math.random() - 0.5) * 100,
            Math.random() > 0.5 ? "255, 23, 68" : "255, 255, 255"
          )
        );
      }
    }

    function restartAnimation() {
      currentPoint = 0;
      animationStarted = false;
      message.classList.remove("show");
    }

    function animate() {
      ctx.fillStyle = "rgba(2, 1, 4, 0.18)";
      ctx.fillRect(0, 0, width, height);

      drawHeartTrail();

      particles.forEach((particle) => {
        particle.update();
        particle.draw();
      });

      particles = particles.filter((particle) => particle.life > 0);

      ctx.shadowBlur = 0;

      requestAnimationFrame(animate);
    }

    resizeCanvas();
    animate();
  </script>
</body>
</html>
